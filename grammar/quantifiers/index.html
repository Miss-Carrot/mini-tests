<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantifiers (1)</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<style>
  :root{
    --bg:#0f1116;
    --card:#1a1d27;
    --border:#2b2f3a;
    --text:#e8e9ee;
    --muted:#9aa0ad;
    --accent:#5b8def;
    --green:#2fbf71;
    --green-bg:#12321f;
    --green-text:#c9f6dc;
    --red:#e6534a;
    --red-bg:#3a1616;
    --red-text:#ffd0cc;
    --input-bg:#12141b;
  }
  html[data-theme="light"]{
    --bg:#f4f5f8;
    --card:#ffffff;
    --border:#dfe2ea;
    --text:#1b1d24;
    --muted:#6b7180;
    --accent:#3763d6;
    --green:#1f9d5c;
    --green-bg:#e4f8ec;
    --green-text:#0f5c33;
    --red:#d63c33;
    --red-bg:#fdeceb;
    --red-text:#8a231c;
    --input-bg:#f9f9fb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 16px 60px;
    transition:background .2s, color .2s;
  }
  .wrap{max-width:820px;margin:0 auto;}
  h1{text-align:center;font-size:1.5rem;margin-bottom:4px;}
  .sub{text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:12px;}
  .options-note{
    text-align:center;font-size:0.95rem;margin-bottom:20px;
  }
  .options-note span{
    display:inline-block;background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:3px 11px;margin:2px;font-weight:600;
  }
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;
    border-bottom:1px solid var(--border);margin-bottom:16px;
  }
  #timer{
    font-size:1.3rem;font-weight:700;padding:6px 14px;border-radius:8px;
    background:var(--card);border:1px solid var(--border);min-width:80px;text-align:center;
  }
  #timer.warn{color:var(--red);border-color:var(--red);}
  #score{font-size:1rem;color:var(--muted);}
  #theme-toggle{
    background:var(--card);color:var(--text);border:1px solid var(--border);
    padding:6px 12px;border-radius:8px;font-size:0.85rem;cursor:pointer;
  }
  .item{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:13px 16px;margin-bottom:10px;
  }
  .sentence{font-size:1.05rem;line-height:2.2;}
  .num{color:var(--muted);font-size:0.85rem;margin-right:6px;}
  select.answer{
    min-width:120px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);
    background:var(--input-bg);color:var(--text);font-size:1rem;
    outline:none;font-family:inherit;margin:0 3px;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  select.answer:focus{border-color:var(--accent);}
  select.answer.correct{background:var(--green-bg);border-color:var(--green);color:var(--green-text);}
  select.answer.incorrect{background:var(--red-bg);border-color:var(--red);color:var(--red-text);}
  select.answer:disabled{opacity:0.85;cursor:default;}
  /* Correct answers are in the markup but stay hidden until the pop-up is closed after time is up */
  .reveal{display:none;margin-top:6px;font-size:0.9rem;color:var(--green-text);
    background:var(--green-bg);border:1px solid var(--green);border-radius:8px;padding:6px 10px;}
  body.show-answers .reveal{display:block;}
  #check-btn{
    display:block;width:100%;background:var(--accent);color:#fff;border:none;
    padding:13px 18px;border-radius:10px;font-size:1rem;font-weight:600;
    cursor:pointer;margin-top:16px;
  }
  #check-btn:hover{opacity:0.9;}
  #check-btn:disabled{opacity:0.5;cursor:not-allowed;}
  #finish-overlay{
    display:none;position:fixed;inset:0;background:rgba(10,11,15,0.55);
    align-items:center;justify-content:center;z-index:20;
  }
  #finish-box{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:28px 30px;text-align:center;max-width:340px;color:var(--text);
  }
  #finish-emoji{font-size:3rem;line-height:1;margin-bottom:6px;}
  #finish-box h2{margin-top:0;margin-bottom:4px;}
  #finish-box p{color:var(--muted);}
  button.primary{
    background:var(--accent);color:#fff;border:none;padding:10px 24px;
    border-radius:8px;font-size:0.95rem;cursor:pointer;margin-top:10px;
  }
  button.primary:hover{opacity:0.9;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Quantifiers (1)</h1>
  <p class="sub">Complete the sentences by choosing the correct word from each drop-down list, then press Check. You have 5 minutes.</p>
  <p class="options-note">
    <span>many</span><span>much</span><span>a little</span><span>little</span><span>few</span><span>a few</span><span>less</span><span>fewer</span>
  </p>

  <div class="top-bar">
    <div id="timer">05:00</div>
    <div id="score">0 / 20 correct</div>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
  </div>

  <div id="quiz"></div>
  <button id="check-btn" onclick="finishNow()">Check</button>
</div>

<div id="finish-overlay">
  <div id="finish-box">
    <div id="finish-emoji">🫠</div>
    <h2 id="finish-title">Time's up!</h2>
    <p id="final-score"></p>
    <button class="primary" onclick="closePopup()">OK</button>
  </div>
</div>

<script>
const OPTIONS = ["many", "much", "a little", "little", "few", "a few", "less", "fewer"];

// "{}" marks the gap; answers = accepted choices.
const baseData = [
  { text: "I don't have {} time before my next meeting, so could you get straight to the point?", answers: ["much"] },
  { text: "There aren't {} affordable apartments available in this area, which is why so many young people choose to rent outside the city centre.", answers: ["many"] },
  { text: "I've been trying to spend {} money on takeaway food and cook more meals at home.", answers: ["less"] },
  { text: "We had {} problems during the first few weeks of the project, but everything seems to be running smoothly now.", answers: ["a few"] },
  { text: "How {} time do you usually spend commuting to work?", answers: ["much"] },
  { text: "There are {} people I can rely on when things get difficult, and I'm genuinely grateful for that.", answers: ["a few"] },
  { text: "I wish I had {} opportunities to travel abroad while I was younger.", answers: ["many"] },
  { text: "Since I started working remotely, I spend {} time commuting and have more time for myself.", answers: ["less"] },
  { text: "There isn't {} information available about the company's future plans, so we're all a bit uncertain.", answers: ["much"] },
  { text: "I've made {} progress with my English recently, although I still struggle with speaking fluently.", answers: ["a little"] },
  { text: "There are {} reasons why people decide to change careers, and salary isn't always the main one.", answers: ["many"] },
  { text: "We need to make sure that {} people are involved in the decision-making process. Otherwise, important perspectives might be overlooked.", answers: ["many"] },
  { text: "I don't think we have {} evidence to support this conclusion. We need to do more research.", answers: ["much"] },
  { text: "I've got {} things to finish before the weekend, but nothing particularly urgent.", answers: ["a few"] },
  { text: "The new system requires {} training than the previous one, which makes it much easier for new employees to get started.", answers: ["less"] },
  { text: "Unfortunately, very {} people are willing to admit when they've made a mistake.", answers: ["few"] },
  { text: "I don't earn {} money at the moment, but I'm managing to put something aside every month.", answers: ["much"] },
  { text: "There were {} complaints about the new policy than the management had expected.", answers: ["fewer"] },
  { text: "We have {} time left, so let's focus on the most important issues rather than discussing every little detail.", answers: ["little"] },
  { text: "Not {} companies are willing to invest in employee development, even though it can improve staff retention.", answers: ["many"] }
];

// Fisher-Yates shuffle: new order on every page load
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const data = shuffle(baseData);

const scoreMessages = {
  20: ["💎", "Simply outstanding!"],
  19: ["🏆", "Nearly flawless!"],
  18: ["🔥", "Absolutely fantastic!"],
  17: ["🥳", "Excellent work!"],
  16: ["⚡", "Great job!"],
  15: ["🎯", "Strong performance!"],
  14: ["🦋", "Very well done!"],
  13: ["🎨", "Really nice work!"],
  12: ["🐬", "Good job!"],
  11: ["🌻", "Nice progress!"],
  10: ["🦊", "You're doing fine!"],
  9:  ["🎈", "Good effort!"],
  8:  ["🐙", "Not bad at all!"],
  7:  ["🪴", "You're getting better!"],
  6:  ["🧸", "A fair attempt!"],
  5:  ["🐝", "You're finding your way!"],
  4:  ["🍋", "Don't lose motivation!"],
  3:  ["🐥", "Every try counts!"],
  2:  ["🌱", "There's room to grow!"],
  1:  ["🐢", "Keep pushing forward!"],
  0:  ["🫠", "Back to the basics!"]
};

const quizEl = document.getElementById("quiz");
let correctCount = 0;
let timeLeft = 300; // 5 minutes
let timerId = null;
const entries = [];   // { select, item }

data.forEach((item, idx) => {
  const row = document.createElement("div");
  row.className = "item";

  const sentence = document.createElement("div");
  sentence.className = "sentence";

  const num = document.createElement("span");
  num.className = "num";
  num.textContent = (idx + 1) + ".";
  sentence.appendChild(num);

  const parts = item.text.split("{}");
  sentence.appendChild(document.createTextNode(parts[0]));

  const select = document.createElement("select");
  select.className = "answer";
  const blank = document.createElement("option");
  blank.value = "";
  blank.textContent = "— choose —";
  select.appendChild(blank);
  OPTIONS.forEach(o => {
    const opt = document.createElement("option");
    opt.value = o;
    opt.textContent = o;
    select.appendChild(opt);
  });
  // No live validation: colours appear only after Check / when time runs out
  select.addEventListener("change", () => select.classList.remove("correct", "incorrect"));
  sentence.appendChild(select);

  sentence.appendChild(document.createTextNode(parts[1]));

  // Hidden until the pop-up is closed after time is up
  const reveal = document.createElement("div");
  reveal.className = "reveal";
  reveal.textContent = "Correct answer: " + item.answers.join(" OR ");

  row.appendChild(sentence);
  row.appendChild(reveal);
  quizEl.appendChild(row);
  entries.push({ select, item });
});

function gradeAll(){
  let count = 0;
  entries.forEach(({ select, item }) => {
    if (select.value === ""){
      select.classList.remove("correct", "incorrect");
      return;
    }
    const ok = item.answers.includes(select.value);
    if (ok) count++;
    select.classList.toggle("correct", ok);
    select.classList.toggle("incorrect", !ok);
  });
  correctCount = count;
  document.getElementById("score").textContent = correctCount + " / " + data.length + " correct";
}

function formatTime(t){
  const m = Math.floor(t / 60).toString().padStart(2, "0");
  const s = (t % 60).toString().padStart(2, "0");
  return m + ":" + s;
}

function tick(){
  timeLeft--;
  renderClock();
  if (timeLeft <= 0) endQuiz();
}

function renderClock(){
  const timerEl = document.getElementById("timer");
  timerEl.textContent = formatTime(Math.max(timeLeft, 0));
  if (timeLeft <= 10) timerEl.classList.add("warn");
}

// Pressing Check before time is up ends the quiz at once: the clock jumps to 00:00
// and the score pop-up appears (the answers follow when the pop-up is closed).
function finishNow(){
  timeLeft = 0;
  renderClock();
  endQuiz();
}

let finished = false;
function endQuiz(){
  if (finished) return;
  finished = true;
  clearInterval(timerId);
  gradeAll();
  // Unanswered gaps are marked red at the end so students see what they missed
  entries.forEach(({ select }) => {
    if (select.value === "") select.classList.add("incorrect");
    select.disabled = true;
  });
  document.getElementById("check-btn").disabled = true;

  const [emoji, message] = scoreMessages[correctCount] || scoreMessages[0];
  document.getElementById("finish-emoji").textContent = emoji;
  document.getElementById("finish-title").textContent = message;
  document.getElementById("final-score").textContent =
    "You got " + correctCount + " out of " + data.length + " correct.";
  document.getElementById("finish-overlay").style.display = "flex";
}

// Closing the pop-up keeps all answers in place and now reveals the correct answers
function closePopup(){
  document.getElementById("finish-overlay").style.display = "none";
  document.body.classList.add("show-answers");
}

function toggleTheme(){
  const html = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  if (html.getAttribute("data-theme") === "light"){
    html.removeAttribute("data-theme");
    btn.textContent = "☀ Light";
  } else {
    html.setAttribute("data-theme", "light");
    btn.textContent = "🌙 Dark";
  }
}

timerId = setInterval(tick, 1000);
</script>
</body>
</html>
